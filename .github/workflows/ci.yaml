# Runs `just ci` — the same checks as locally — and replays the migrations, on every PR and on main. The `ci`
# and `replay-migrations` jobs are required status checks (the "Require CI" ruleset), so keep their names
# stable and don't add `paths:` filters: a required check that never reports leaves the PR waiting forever.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs, but let every push to main finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build validates these variables' format only, and no page connects to the database or calls
      # Clerk at build time, so well-formed placeholders are enough and CI never holds real secrets
      DATABASE_URL: postgresql://ci:ci@db.invalid/ci
      CLERK_SECRET_KEY: sk_test_ci
      # Base64 of `clerk.example.com$`, so it decodes the way Clerk expects a real key to
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just ci

  # Replays the whole history on an empty database, proving the baseline plus every migration since builds
  # the schema from nothing. Needs no secrets, so it runs on forks too.
  replay-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Production's major version
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just db-migrate
      # Starts from existing history, as production does
      - run: just db-migrate
      # A migrator upgrade that re-applies recorded migrations leaves extra rows, even when the SQL it
      # re-ran is idempotent and didn't fail
      - name: Check each migration is recorded once
        run: |
          recorded=$(psql "$DATABASE_URL" --tuples-only --no-align \
            --command 'SELECT count(*) FROM drizzle.__drizzle_migrations')
          expected=$(jq '.entries | length' drizzle/meta/_journal.json)
          echo "Recorded $recorded migrations; the journal has $expected"
          [ "$recorded" -eq "$expected" ]
