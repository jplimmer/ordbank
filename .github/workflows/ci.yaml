# Runs `just ci` — the same checks as locally — and tests the PR's migrations, on every PR and on main. The
# `ci`, `migration-replay` and `pr-branch` jobs are required status checks (the "Require CI" ruleset), so
# keep their names stable and don't add `paths:` filters: a required check that never reports leaves the PR
# waiting forever.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs, but let every push to main finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build validates these variables' format only, and no page connects to the database or calls
      # Clerk at build time, so well-formed placeholders are enough and CI never holds real secrets
      DATABASE_URL: postgresql://ci:ci@db.invalid/ci
      CLERK_SECRET_KEY: sk_test_ci
      # Base64 of `clerk.example.com$`, so it decodes the way Clerk expects a real key to
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just ci

  # Replays the whole history on an empty database, proving the baseline plus every migration since builds
  # the schema from nothing. Needs no secrets, so it runs on forks too.
  migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Production's major version
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just db-migrate

  # Applies the PR's migrations to a copy of template (production's schema and history, plus seed data
  # covering awkward states), the incremental path production will take on merge. The Neon branch
  # `pr-<number>` is reset on every push and deleted when the PR closes (pr-branch-cleanup.yaml).
  pr-branch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Fork PRs get no secrets, so they can't create a branch. The job still passes, as the required check
      # must report, and says it was skipped.
      IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - if: env.IS_FORK == 'true'
        run: |
          echo "::notice::Skipped: pull requests from forks can't reach Neon, so a maintainer must test these migrations"

      # Every step that uses the API key runs before the checkout. Once the PR's code is on the runner it
      # could tamper with later steps, so it must never share the runner with the key.

      # A backstop for close events that never run: Neon deletes the branch itself after two weeks
      - if: env.IS_FORK == 'false'
        id: expiry
        run: echo "expires_at=$(date -u -d '+14 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Creates the branch from template on the PR's first run and reuses it afterwards
      - if: env.IS_FORK == 'false'
        id: branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: pr-${{ github.event.number }}
          parent_branch: template
          expires_at: ${{ steps.expiry.outputs.expires_at }}

      # A reused branch still has the previous push's migrations, which may since have been edited
      - if: env.IS_FORK == 'false' && steps.branch.outputs.created == 'false'
        uses: neondatabase/reset-branch-action@470ab8101095ea33737c294d17364a72fd80761b # v1.3.2
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.branch.outputs.branch_id }}
          parent: true

      - if: env.IS_FORK == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.IS_FORK == 'false'
        uses: ./.github/actions/setup

      # The connection string survives a reset
      - if: env.IS_FORK == 'false'
        run: just db-migrate
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
