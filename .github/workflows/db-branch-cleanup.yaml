# Deletes the PR's Neon branch, created by the `migrate-db-branch` job in ci.yaml, when the PR is merged or
# closed. Reopening the PR creates it again on the next CI run.

name: DB branch cleanup

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete-db-branch:
    # Fork PRs never got a branch, and get no secrets to delete one with
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: pr-${{ github.event.number }}
